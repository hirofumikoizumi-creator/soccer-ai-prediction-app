name: EAS Build and Submit to App Store

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS app
        run: |
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --wait \
            --auto-submit
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}

      - name: Build completed
        if: success()
        run: echo "✅ Build and submission completed successfully!"

      - name: Build failed
        if: failure()
        run: echo "❌ Build failed. Check the logs above for details."
